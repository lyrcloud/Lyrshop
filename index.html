<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace - Buy & Sell Online</title>
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <link rel="manifest" href="/site.webmanifest?v=2" />
  <meta name="theme-color" content="#e53238" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css?v=20261026-2" />
</head>
<body>
  <header class="header">
    <div class="utility-bar">
      <div class="utility-inner">
        <div class="utility-links">
          <a href="index.html?view=deals#product-list">Deals</a>
          <a href="brands.html">Brands</a>
          <a href="giftcards.html">Gift Cards</a>
          <a href="admin.html">Sell</a>
          <a href="dashboard.html">Help & Orders</a>
        </div>
        <div class="utility-links utility-right">
          <a href="index.html?view=watchlist#product-list">Watchlist <span class="count-badge" data-count="watchlist" hidden></span></a>
          <a href="dashboard.html">My Lyrshop</a>
          <a href="cart.html">Cart <span class="count-badge" data-count="cart" hidden></span></a>
          <span data-locale-picker></span>
          <span class="utility-greeting" data-user-greeting>Hi! <a href="auth.html">Sign in</a> or <a href="auth.html">register</a></span>
        </div>
      </div>
    </div>

    <div class="header-top">
      <a href="index.html" class="logo-link" aria-label="Lyrshop home">
        <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
          <text x="15" y="72" font-family="Georgia, serif" font-size="60" font-weight="bold" font-style="italic" fill="#e53238" letter-spacing="-2">lyrshop</text>
        </svg>
      </a>
      <div class="category-menu-wrap">
        <button class="category-menu" id="category-menu-button" type="button" aria-expanded="false" aria-controls="category-menu-panel">Shop by category</button>
        <div class="category-menu-panel" id="category-menu-panel" hidden></div>
      </div>
      <form class="search-bar" id="search-form" role="search">
        <div class="search-field">
          <input type="text" id="search-input" placeholder="Search for anything..." autocomplete="off" role="combobox" aria-expanded="false" aria-controls="search-suggestions" aria-autocomplete="list" aria-label="Search products" />
          <button type="button" class="search-clear" aria-label="Clear search" hidden>&times;</button>
          <kbd class="search-hint" aria-hidden="true">/</kbd>
        </div>
        <select class="search-category" aria-label="Search category">
          <option value="">All Categories</option>
        </select>
        <button type="submit" class="search-button">Search</button>
        <ul class="search-suggestions" id="search-suggestions" role="listbox" hidden></ul>
      </form>
      <div class="header-actions">
        <a href="dashboard.html" id="account-link" class="button button-secondary">Account</a>
      </div>
    </div>

  </header>

  <main class="main">
    <div class="event-banner" id="event-banner" role="status" hidden></div>
    <section class="hero-slider" id="hero-slider" aria-roledescription="carousel" aria-label="Featured offers">
      <div class="hero-track" id="hero-track"></div>
      <button type="button" class="hero-arrow hero-arrow-prev" id="hero-prev" aria-label="Previous slide">&#8249;</button>
      <button type="button" class="hero-arrow hero-arrow-next" id="hero-next" aria-label="Next slide">&#8250;</button>
      <div class="hero-dots" id="hero-dots" role="tablist" aria-label="Choose slide"></div>
    </section>


    <div class="content-grid content-grid-full">
      <section class="hero-deals">
      <div class="deals-header">
        <h2 id="listing-title">Today's Deals</h2>
        <p id="listing-subtitle">Great savings on popular items</p>
      </div>
      <div id="listing-filters" class="listing-filters" hidden></div>
      <div class="listing-toolbar">
        <p id="listing-count" class="listing-count" aria-live="polite"></p>
        <div id="active-filters" class="active-filters"></div>
        <label class="sort-control">
          <span>Location</span>
          <select id="near-select">
            <option value="">Anywhere</option>
            <option value="region">In your region</option>
            <option value="country">In your country</option>
          </select>
        </label>
        <label class="sort-control">
          <span>Condition</span>
          <select id="condition-select">
            <option value="">Any</option>
            <option value="new">New</option>
            <option value="open_box">Open box</option>
            <option value="refurbished">Refurbished</option>
            <option value="used">Used</option>
            <option value="for_parts">For parts</option>
          </select>
        </label>
        <label class="sort-control">
          <span>Buying format</span>
          <select id="format-select">
            <option value="">All listings</option>
            <option value="auction">Auction</option>
            <option value="fixed">Buy It Now</option>
            <option value="offers">Accepts offers</option>
          </select>
        </label>
        <label class="sort-control">
          <span>Sort by</span>
          <select id="sort-select">
            <option value="nearby">Best for your location</option>
            <option value="latest">Latest uploads</option>
            <option value="trending">Trending</option>
            <option value="featured">Featured</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="discount">Biggest discount</option>
            <option value="name">Name: A to Z</option>
            <option value="ending">Auctions: ending soonest</option>
          </select>
        </label>
      </div>
      <div id="product-list" class="product-grid"></div>
      </section>

    </div>
  </main>

  <footer data-site-footer>
    <p>&copy; 2026 Lyrshop. Powered by Lyrcloud.</p>
  </footer>

  <script src="auth.js?v=20261023-1"></script>
  <script src="locale.js?v=20261018-1"></script>
  <script src="categories.js?v=20261025-1"></script>
  <script src="ui.js?v=20261026-1"></script>
  <script src="app.js?v=20261025-2"></script>
  <script src="footer.js?v=20261025-1"></script>
  <script src="lyrbot.js?v=20261018-1"></script>
</body>
</html>
