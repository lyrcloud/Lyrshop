<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyrshop Invoice</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#e53238" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css?v=20261026-5" />
</head>
<body>
  <header class="page-header compact-header invoice-chrome">
    <a href="index.html" aria-label="Lyrshop home">
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
        <text x="15" y="72" font-family="Georgia, serif" font-size="60" font-weight="bold" font-style="italic" fill="#e53238">lyrshop</text>
      </svg>
    </a>
    <div class="header-actions">
      <a href="dashboard.html#purchases" class="button button-secondary">My orders</a>
    </div>
  </header>

  <main class="invoice-page">
    <div class="invoice-actions invoice-chrome">
      <button type="button" class="button button-secondary" id="invoice-print">Print or save as PDF</button>
      <button type="button" class="button button-primary" id="invoice-pay" hidden>Pay by card</button>
      <span id="invoice-message" class="checkout-muted" role="status"></span>
    </div>
    <article class="invoice-sheet" id="invoice-sheet"><p class="my-empty">Loading…</p></article>
  </main>

  <script src="auth.js?v=20261023-1"></script>
  <script src="locale.js?v=20261018-1"></script>
  <script src="ui.js?v=20261026-3"></script>
  <script src="invoice.js?v=20261025-1"></script>
</body>
</html>
